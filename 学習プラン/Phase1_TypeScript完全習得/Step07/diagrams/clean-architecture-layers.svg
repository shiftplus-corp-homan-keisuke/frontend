<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="600" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    クリーンアーキテクチャの4つのレイヤー
  </text>
  
  <!-- 最外層: Framework層 -->
  <circle cx="300" cy="320" r="250" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <text x="300" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
    Framework層
  </text>
  <text x="300" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">
    (外部ライブラリ、DB、Web、UI)
  </text>
  
  <!-- Interface Adapter層 -->
  <circle cx="300" cy="320" r="190" fill="none" stroke="#f39c12" stroke-width="3"/>
  <text x="300" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f39c12">
    Interface Adapter層
  </text>
  <text x="300" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f39c12">
    (Repository、Presenter、Controller)
  </text>
  
  <!-- UseCase層 -->
  <circle cx="300" cy="320" r="130" fill="none" stroke="#3498db" stroke-width="3"/>
  <text x="300" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">
    UseCase層
  </text>
  <text x="300" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3498db">
    (アプリケーション固有のビジネスルール)
  </text>
  
  <!-- Entity層 -->
  <circle cx="300" cy="320" r="70" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="3"/>
  <text x="300" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
    Entity層
  </text>
  <text x="300" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">
    (ビジネスルール・ドメインロジック)
  </text>
  
  <!-- 依存関係の矢印 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- 依存関係の説明 -->
  <text x="300" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">
    依存関係の方向: 外側 → 内側（一方向のみ）
  </text>
  
  <!-- 矢印 -->
  <line x1="450" y1="400" x2="350" y2="350" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="450" x2="330" y2="380" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="480" x2="310" y2="400" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
