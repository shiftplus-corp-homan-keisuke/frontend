<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    リテラル型とUnion型
  </text>
  
  <!-- 説明 -->
  <text x="450" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
    特定の値のみを許可するリテラル型と、複数の型を組み合わせるUnion型
  </text>
  
  <!-- リテラル型の説明 -->
  <text x="225" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
    リテラル型（Literal Types）
  </text>
  <text x="675" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
    Union型（Union Types）
  </text>
  
  <!-- リテラル型の例 -->
  <rect x="50" y="120" width="350" height="180" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    特定の値のみを許可
  </text>
  
  <!-- 文字列リテラル型 -->
  <text x="60" y="165" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    type Status = "pending" | "approved" | "rejected";
  </text>
  <text x="60" y="180" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    let userStatus: Status = "pending"; // ✅ OK
  </text>
  <text x="60" y="195" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
    let badStatus: Status = "unknown"; // ❌ エラー
  </text>
  
  <!-- 数値リテラル型 -->
  <text x="60" y="220" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    type Grade = 1 | 2 | 3 | 4;
  </text>
  <text x="60" y="235" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    let studentGrade: Grade = 3; // ✅ OK
  </text>
  <text x="60" y="250" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
    let invalidGrade: Grade = 5; // ❌ エラー
  </text>
  
  <!-- ブール値リテラル型 -->
  <text x="60" y="275" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    type IsActive = true;
  </text>
  <text x="60" y="290" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    let activeFlag: IsActive = true; // ✅ OK
  </text>
  
  <!-- Union型の例 -->
  <rect x="500" y="120" width="350" height="180" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="510" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
    複数の型を組み合わせ
  </text>
  
  <!-- 基本的なUnion型 -->
  <text x="510" y="165" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    type StringOrNumber = string | number;
  </text>
  <text x="510" y="180" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    let value: StringOrNumber = "hello"; // ✅ OK
  </text>
  <text x="510" y="195" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    value = 42; // ✅ OK
  </text>
  
  <!-- オブジェクト型のUnion -->
  <text x="510" y="220" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    type User = { type: "admin"; permissions: string[] }
  </text>
  <text x="510" y="235" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
             | { type: "user"; profile: UserProfile };
  </text>
  <text x="510" y="260" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    let currentUser: User = {
  </text>
  <text x="510" y="275" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
      type: "admin", permissions: ["read", "write"]
  </text>
  <text x="510" y="290" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    };
  </text>
  
  <!-- 実践例：学生管理システム -->
  <text x="450" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    実践例：学生管理システムでのリテラル型とUnion型
  </text>
  
  <rect x="100" y="360" width="700" height="220" fill="#f8f9fa" stroke="#95a5a6" stroke-width="2" rx="5"/>
  
  <!-- 学生ステータス定義 -->
  <text x="120" y="380" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    // 学生のステータス（リテラル型のUnion）
  </text>
  <text x="120" y="395" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
    type StudentStatus = "enrolled" | "graduated" | "suspended" | "withdrawn";
  </text>
  
  <!-- 学年定義 -->
  <text x="120" y="420" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    // 学年（数値リテラル型のUnion）
  </text>
  <text x="120" y="435" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
    type Grade = 1 | 2 | 3 | 4;
  </text>
  
  <!-- 学生型定義 -->
  <text x="120" y="460" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    // 学生情報（Union型を活用）
  </text>
  <text x="120" y="475" font-family="Monaco, monospace" font-size="11" fill="#3498db">
    type Student = {
  </text>
  <text x="120" y="490" font-family="Monaco, monospace" font-size="11" fill="#3498db">
      id: number;
  </text>
  <text x="120" y="505" font-family="Monaco, monospace" font-size="11" fill="#3498db">
      name: string;
  </text>
  <text x="120" y="520" font-family="Monaco, monospace" font-size="11" fill="#3498db">
      status: StudentStatus;
  </text>
  <text x="120" y="535" font-family="Monaco, monospace" font-size="11" fill="#3498db">
      grade: Grade;
  </text>
  <text x="120" y="550" font-family="Monaco, monospace" font-size="11" fill="#3498db">
      contact: string | { email: string; phone?: string }; // Union型
  </text>
  <text x="120" y="565" font-family="Monaco, monospace" font-size="11" fill="#3498db">
    };
  </text>
  
  <!-- 型ガード（Type Guards）の説明 -->
  <text x="450" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    型ガード（Type Guards）でUnion型を安全に扱う
  </text>
  
  <rect x="100" y="630" width="700" height="60" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  
  <text x="120" y="650" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    function processContact(contact: string | { email: string; phone?: string }) {
  </text>
  <text x="120" y="665" font-family="Monaco, monospace" font-size="11" fill="#f39c12">
        if (typeof contact === "string") {
  </text>
  <text x="120" y="680" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
            return `Contact: ${contact}`; // string型として扱える
  </text>
  <text x="450" y="680" font-family="Monaco, monospace" font-size="11" fill="#f39c12">
        } else {
  </text>
  <text x="500" y="680" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
            return `Email: ${contact.email}`; // オブジェクト型として扱える
  </text>
  <text x="750" y="680" font-family="Monaco, monospace" font-size="11" fill="#f39c12">
        }
  </text>
  <text x="120" y="695" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    }
  </text>
</svg>
