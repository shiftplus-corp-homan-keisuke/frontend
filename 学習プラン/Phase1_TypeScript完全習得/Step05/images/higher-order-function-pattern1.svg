<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="300" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  
  <!-- タイトル -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a202c">
    パターン1: 関数を引数として受け取る高階関数
  </text>
  
  <!-- 左側: 入力関数 -->
  <g>
    <rect x="50" y="80" width="120" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">
      📥 入力関数
    </text>
    <text x="110" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1976d2">
      double
    </text>
    <text x="110" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">
      (x) => x * 2
    </text>
  </g>
  
  <!-- 矢印1 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  <line x1="170" y1="120" x2="250" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 中央: 高階関数 -->
  <g>
    <rect x="250" y="70" width="300" height="100" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
    <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
      🏭 高階関数
    </text>
    <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">
      executeOperation(5, 関数)
    </text>
    <text x="400" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      関数を受け取って実行
    </text>
    <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      double(5) → 10
    </text>
  </g>
  
  <!-- 矢印2 -->
  <line x1="550" y1="120" x2="630" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 右側: 結果 -->
  <g>
    <rect x="630" y="80" width="120" height="80" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="8"/>
    <text x="690" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388e3c">
      📤 結果
    </text>
    <text x="690" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#388e3c">
      10
    </text>
  </g>
  
  <!-- データフロー（数値5） -->
  <g>
    <circle cx="110" cy="200" r="25" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
    <text x="110" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c2185b">
      データ
    </text>
    <text x="110" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2185b">
      5
    </text>
    
    <!-- データフローの矢印 -->
    <line x1="135" y1="190" x2="250" y2="150" stroke="#c2185b" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  </g>
  
  <!-- 説明テキスト -->
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    💡 同じ枠組みで、異なる関数（square, addTen等）も使用可能
  </text>
</svg>
