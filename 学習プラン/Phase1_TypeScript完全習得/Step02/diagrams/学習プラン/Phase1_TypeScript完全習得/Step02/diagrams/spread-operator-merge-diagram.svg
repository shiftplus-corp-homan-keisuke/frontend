<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="820" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    スプレッド演算子によるオブジェクトマージの詳細図解
  </text>
  
  <!-- コード部分 -->
  <rect x="50" y="60" width="1100" height="100" fill="#2c3e50" stroke="#34495e" stroke-width="2" rx="10"/>
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ecf0f1">
    複数設定の更新処理
  </text>
  <text x="70" y="105" font-family="Monaco, monospace" font-size="12" fill="#e74c3c">
    return {
  </text>
  <text x="90" y="120" font-family="Monaco, monospace" font-size="12" fill="#3498db">
      ...config,
  </text>
  <text x="90" y="135" font-family="Monaco, monospace" font-size="12" fill="#3498db">
      ...keyOrOverrides,
  </text>
  <text x="90" y="150" font-family="Monaco, monospace" font-size="12" fill="#27ae60">
      features: { ...config.features, ...keyOrOverrides.features }
  </text>
  <text x="70" y="165" font-family="Monaco, monospace" font-size="12" fill="#e74c3c">
    };
  </text>
  
  <!-- ステップ1: 元のconfig -->
  <rect x="50" y="190" width="350" height="200" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">
    ステップ1: 元のconfig
  </text>
  
  <rect x="70" y="230" width="310" height="140" fill="#ffffff" stroke="#3498db" stroke-width="1" rx="5"/>
  <text x="80" y="250" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    config = {
  </text>
  <text x="80" y="265" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      apiUrl: "https://old-api.com",
  </text>
  <text x="80" y="280" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      timeout: 3000,
  </text>
  <text x="80" y="295" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      retryCount: 3,
  </text>
  <text x="80" y="310" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      features: {
  </text>
  <text x="80" y="325" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
        darkMode: false,
  </text>
  <text x="80" y="340" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
        notifications: true,
  </text>
  <text x="80" y="355" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
        analytics: false
  </text>
  <text x="80" y="370" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      }
  </text>
  <text x="80" y="385" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    }
  </text>
  
  <!-- ステップ2: keyOrOverrides -->
  <rect x="420" y="190" width="350" height="200" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="10"/>
  <text x="440" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">
    ステップ2: keyOrOverrides
  </text>
  
  <rect x="440" y="230" width="310" height="140" fill="#ffffff" stroke="#f39c12" stroke-width="1" rx="5"/>
  <text x="450" y="250" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    keyOrOverrides = {
  </text>
  <text x="450" y="265" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      apiUrl: "https://new-api.com",
  </text>
  <text x="450" y="280" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      timeout: 5000,
  </text>
  <text x="450" y="295" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      features: {
  </text>
  <text x="450" y="310" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
        darkMode: true,
  </text>
  <text x="450" y="325" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
        analytics: true
  </text>
  <text x="450" y="340" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      }
  </text>
  <text x="450" y="355" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    }
  </text>
  
  <!-- ステップ3: 基本マージ -->
  <rect x="800" y="190" width="350" height="200" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="820" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
    ステップ3: ...config, ...keyOrOverrides
  </text>
  
  <rect x="820" y="230" width="310" height="140" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="830" y="250" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    基本マージ結果 = {
  </text>
  <text x="830" y="265" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
      apiUrl: "https://new-api.com", // 上書き
  </text>
  <text x="830" y="280" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
      timeout: 5000, // 上書き
  </text>
  <text x="830" y="295" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      retryCount: 3, // 保持
  </text>
  <text x="830" y="310" font-family="Monaco, monospace" font-size="11" fill="#e67e22">
      features: { // オブジェクト参照が置換される
  </text>
  <text x="830" y="325" font-family="Monaco, monospace" font-size="11" fill="#e67e22">
        darkMode: true,
  </text>
  <text x="830" y="340" font-family="Monaco, monospace" font-size="11" fill="#e67e22">
        analytics: true
  </text>
  <text x="830" y="355" font-family="Monaco, monospace" font-size="11" fill="#e67e22">
        // notifications: true が失われる！
  </text>
  <text x="830" y="370" font-family="Monaco, monospace" font-size="11" fill="#e67e22">
      }
  </text>
  <text x="830" y="385" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    }
  </text>
  
  <!-- 問題の説明 -->
  <rect x="50" y="410" width="1100" height="80" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="10"/>
  <text x="70" y="435" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
    ⚠️ 問題: ネストしたオブジェクトの完全置換
  </text>
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    スプレッド演算子は浅いマージのため、featuresオブジェクト全体が置換され、元のnotifications: trueが失われます。
  </text>
  <text x="70" y="480" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    これを防ぐために、featuresプロパティを個別にマージする必要があります。
  </text>
  
  <!-- ステップ4: 正しいマージ -->
  <rect x="50" y="510" width="550" height="250" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="70" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
    ステップ4: 正しいfeaturesマージ
  </text>
  
  <rect x="70" y="550" width="510" height="190" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="80" y="570" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    features: { ...config.features, ...keyOrOverrides.features }
  </text>
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">
    詳細な展開:
  </text>
  <text x="80" y="610" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
    config.features = { darkMode: false, notifications: true, analytics: false }
  </text>
  <text x="80" y="625" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
    keyOrOverrides.features = { darkMode: true, analytics: true }
  </text>
  <text x="80" y="645" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    マージ結果:
  </text>
  <text x="80" y="665" font-family="Monaco, monospace" font-size="10" fill="#27ae60">
    features: {
  </text>
  <text x="80" y="680" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
      darkMode: false,     // config.featuresから
  </text>
  <text x="80" y="695" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
      notifications: true, // config.featuresから（保持される）
  </text>
  <text x="80" y="710" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
      analytics: false,    // config.featuresから
  </text>
  <text x="80" y="725" font-family="Monaco, monospace" font-size="10" fill="#e74c3c">
      darkMode: true,      // keyOrOverrides.featuresで上書き
  </text>
  <text x="80" y="740" font-family="Monaco, monospace" font-size="10" fill="#e74c3c">
      analytics: true      // keyOrOverrides.featuresで上書き
  </text>
  <text x="80" y="755" font-family="Monaco, monospace" font-size="10" fill="#27ae60">
    }
  </text>
  
  <!-- ステップ5: 最終結果 -->
  <rect x="620" y="510" width="530" height="250" fill="#f0f8f0" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="640" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
    ステップ5: 最終的なマージ結果
  </text>
  
  <rect x="640" y="550" width="490" height="190" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="650" y="570" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    最終結果 = {
  </text>
  <text x="650" y="590" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
      apiUrl: "https://new-api.com", // 更新
  </text>
  <text x="650" y="605" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
      timeout: 5000, // 更新
  </text>
  <text x="650" y="620" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      retryCount: 3, // 保持
  </text>
  <text x="650" y="635" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
      features: { // 正しくマージされた
  </text>
  <text x="650" y="650" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
        darkMode: true, // 更新
  </text>
  <text x="650" y="665" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
        notifications: true, // 保持される！
  </text>
  <text x="650" y="680" font-family="Monaco, monospace" font-size="11" fill="#e74c3c">
        analytics: true // 更新
  </text>
  <text x="650" y="695" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
      }
  </text>
  <text x="650" y="710" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    }
  </text>
  
  <!-- 矢印の定義 -->
  <defs>
    <marker id="merge-arrow" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- フロー矢印 -->
  <line x1="225" y1="390" x2="225" y2="510" stroke="#34495e" stroke-width="2" marker-end="url(#merge-arrow)"/>
  <line x1="595" y1="390" x2="595" y2="510" stroke="#34495e" stroke-width="2" marker-end="url(#merge-arrow)"/>
  <line x1="975" y1="390" x2="885" y2="510" stroke="#34495e" stroke-width="2" marker-end="url(#merge-arrow)"/>
  
  <!-- 重要なポイント -->
  <rect x="50" y="780" width="1100" height="30" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="70" y="800" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    💡 重要: ネストしたオブジェクトの個別マージにより、既存のプロパティを保持しながら必要な部分のみを更新できます
  </text>
</svg>
