<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Flex Container -->
  <rect x="20" y="20" width="560" height="160" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="8"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Flex Container</text>
  
  <!-- Flex Item (期待値) -->
  <rect x="40" y="60" width="300" height="100" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" rx="4"/>
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">Flex Item (期待: 300px)</text>
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">flex: 0 0 300px</text>
  
  <!-- Flex Item (実際値) -->
  <rect x="40" y="60" width="400" height="100" fill="none" stroke="#ef4444" stroke-width="3" rx="4"/>
  <text x="350" y="80" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="bold">実際: 400px</text>
  
  <!-- 子要素 -->
  <rect x="60" y="110" width="360" height="30" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="70" y="128" font-family="Arial, sans-serif" font-size="12" fill="#92400e">子要素 (400px)</text>
  
  <!-- 矢印とラベル -->
  <path d="M 450 125 L 470 125" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="475" y="130" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">はみ出し!</text>
  
  <!-- 矢印マーカー定義 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
