<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    文脈的型推論（Contextual Type Inference）
  </text>
  
  <!-- 説明 -->
  <text x="450" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
    関数の引数や変数が使用される文脈から型を推測する機能
  </text>
  
  <!-- 通常の型推論 vs 文脈的型推論 -->
  <text x="225" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">
    通常の型推論
  </text>
  <text x="675" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
    文脈的型推論
  </text>
  
  <!-- 通常の型推論の例 -->
  <rect x="50" y="120" width="350" height="80" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">
    値から型を推測
  </text>
  <text x="60" y="160" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    const x = 5;        // number型を推測
  </text>
  <text x="60" y="175" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    const name = "太郎"; // string型を推測
  </text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    💡 値の内容から型を決定
  </text>
  
  <!-- 文脈的型推論の例 -->
  <rect x="500" y="120" width="350" height="80" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="510" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
    使用される文脈から型を推測
  </text>
  <text x="510" y="160" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    students.map(student => student.name)
  </text>
  <text x="510" y="175" font-family="Monaco, monospace" font-size="11" fill="#7f8c8d">
    // student引数の型が配列要素型から推測される
  </text>
  <text x="510" y="190" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    💡 使用される場所の文脈から型を決定
  </text>
  
  <!-- 配列メソッドでの文脈的型推論 -->
  <text x="450" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    配列メソッドでの文脈的型推論
  </text>
  
  <rect x="100" y="260" width="700" height="160" fill="#f8f9fa" stroke="#95a5a6" stroke-width="2" rx="5"/>
  
  <!-- 学生データ定義 -->
  <text x="120" y="280" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    const students = [
  </text>
  <text x="120" y="295" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      { id: 1, name: "田中太郎", grade: 3, gpa: 3.8 },
  </text>
  <text x="120" y="310" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
      { id: 2, name: "佐藤花子", grade: 2, gpa: 3.9 }
  </text>
  <text x="120" y="325" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    ];
  </text>
  
  <!-- 文脈的型推論の例 -->
  <text x="120" y="350" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    const names = students.map((student) => student.name);
  </text>
  <text x="120" y="365" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    ↑ student引数の型が配列要素型から自動推測される（文脈的型推論）
  </text>
  
  <text x="120" y="385" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    const highPerformers = students.filter((student) => student.gpa >= 3.5);
  </text>
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    ↑ student引数の型が配列要素型から自動推測される（文脈的型推論）
  </text>
  
  <!-- 高階関数での文脈的型推論 -->
  <text x="450" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    高階関数での文脈的型推論
  </text>
  
  <rect x="100" y="470" width="700" height="100" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  
  <text x="120" y="490" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    type StudentProcessor = (student: Student) => string;
  </text>
  <text x="120" y="510" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    function processStudentNames(students: Student[], processor: StudentProcessor) {
  </text>
  <text x="120" y="525" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
        return students.map(processor);
  </text>
  <text x="120" y="540" font-family="Monaco, monospace" font-size="11" fill="#2c3e50">
    }
  </text>
  <text x="120" y="560" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    const names = processStudentNames(students, (student) => student.name);
  </text>
  <text x="500" y="560" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    ↑ student引数の型がStudentProcessorから推測
  </text>
</svg>
