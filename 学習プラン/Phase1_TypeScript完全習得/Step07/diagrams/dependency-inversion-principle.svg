<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    依存関係逆転の原則（DIP）
  </text>
  
  <!-- 悪い例 -->
  <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
    ❌ 悪い例：具象クラスに依存
  </text>
  
  <!-- 悪い例の図 -->
  <rect x="50" y="90" width="150" height="60" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="125" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    BlogService
  </text>
  <text x="125" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">
    (高レベルモジュール)
  </text>
  
  <rect x="250" y="90" width="150" height="60" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="325" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    MySQLDatabase
  </text>
  <text x="325" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">
    (低レベルモジュール)
  </text>
  
  <!-- 悪い例の矢印 -->
  <defs>
    <marker id="bad-arrow" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  <line x1="200" y1="120" x2="250" y2="120" stroke="#e74c3c" stroke-width="2" marker-end="url(#bad-arrow)"/>
  <text x="225" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">
    直接依存
  </text>
  
  <!-- 良い例 -->
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
    ✅ 良い例：抽象に依存
  </text>
  
  <!-- 良い例の図 -->
  <rect x="450" y="90" width="150" height="60" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="525" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
    BlogService
  </text>
  <text x="525" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
    (高レベルモジュール)
  </text>
  
  <rect x="650" y="90" width="150" height="60" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="725" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">
    IRepository
  </text>
  <text x="725" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">
    (抽象・インターフェース)
  </text>
  
  <rect x="650" y="200" width="150" height="60" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="725" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
    MySQLRepository
  </text>
  <text x="725" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
    (低レベルモジュール)
  </text>
  
  <!-- 良い例の矢印 -->
  <defs>
    <marker id="good-arrow" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60" />
    </marker>
    <marker id="interface-arrow" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12" />
    </marker>
  </defs>
  <line x1="600" y1="120" x2="650" y2="120" stroke="#27ae60" stroke-width="2" marker-end="url(#good-arrow)"/>
  <text x="625" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
    抽象に依存
  </text>
  
  <line x1="725" y1="150" x2="725" y2="200" stroke="#f39c12" stroke-width="2" marker-end="url(#interface-arrow)" stroke-dasharray="5,5"/>
  <text x="750" y="175" text-anchor="start" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">
    実装
  </text>
  
  <!-- 説明テキスト -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    DIPの利点
  </text>
  
  <text x="50" y="350" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
    • テスタビリティ：モックオブジェクトを簡単に注入できる
  </text>
  <text x="50" y="375" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
    • 柔軟性：実装を簡単に変更できる（MySQL → PostgreSQL など）
  </text>
  <text x="50" y="400" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
    • 保守性：変更の影響範囲を限定できる
  </text>
  <text x="50" y="425" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
    • 拡張性：新しい実装を追加しやすい
  </text>
  
  <!-- 依存関係の方向説明 -->
  <text x="400" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">
    高レベルモジュールは低レベルモジュールに依存せず、両方とも抽象に依存する
  </text>
</svg>
