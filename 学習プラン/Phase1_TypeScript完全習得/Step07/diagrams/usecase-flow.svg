<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    UseCase層の処理フロー（CreateBlogPostUseCase例）
  </text>
  
  <!-- フロー開始 -->
  <ellipse cx="450" cy="80" rx="60" ry="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="450" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    開始
  </text>
  
  <!-- ステップ1: 入力検証 -->
  <rect x="375" y="130" width="150" height="50" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="450" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    1. 入力データの検証
  </text>
  <text x="450" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    値オブジェクト作成
  </text>
  
  <!-- ステップ2: 著者確認 -->
  <rect x="100" y="220" width="150" height="50" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="175" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    2. 著者の存在確認
  </text>
  <text x="175" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    AuthorRepository
  </text>
  
  <!-- ステップ3: カテゴリ確認 -->
  <rect x="650" y="220" width="150" height="50" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="725" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    3. カテゴリの存在確認
  </text>
  <text x="725" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    CategoryRepository
  </text>
  
  <!-- ステップ4: エンティティ作成 -->
  <rect x="375" y="310" width="150" height="50" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="450" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    4. BlogPostエンティティ作成
  </text>
  <text x="450" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    ドメインロジック実行
  </text>
  
  <!-- ステップ5: 保存 -->
  <rect x="375" y="400" width="150" height="50" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="450" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    5. データ保存
  </text>
  <text x="450" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    BlogPostRepository
  </text>
  
  <!-- ステップ6: レスポンス -->
  <rect x="375" y="490" width="150" height="50" fill="#f8f9fa" stroke="#95a5a6" stroke-width="2" rx="5"/>
  <text x="450" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    6. 成功レスポンス
  </text>
  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    Presenter
  </text>
  
  <!-- 矢印の定義 -->
  <defs>
    <marker id="flow-arrow" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    <marker id="error-arrow" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- フロー矢印 -->
  <line x1="450" y1="105" x2="450" y2="130" stroke="#34495e" stroke-width="2" marker-end="url(#flow-arrow)"/>
  
  <!-- 分岐矢印 -->
  <line x1="400" y1="180" x2="200" y2="220" stroke="#34495e" stroke-width="2" marker-end="url(#flow-arrow)"/>
  <line x1="500" y1="180" x2="700" y2="220" stroke="#34495e" stroke-width="2" marker-end="url(#flow-arrow)"/>
  
  <!-- 合流矢印 -->
  <line x1="200" y1="270" x2="400" y2="310" stroke="#34495e" stroke-width="2" marker-end="url(#flow-arrow)"/>
  <line x1="700" y1="270" x2="500" y2="310" stroke="#34495e" stroke-width="2" marker-end="url(#flow-arrow)"/>
  
  <!-- 順次処理矢印 -->
  <line x1="450" y1="360" x2="450" y2="400" stroke="#34495e" stroke-width="2" marker-end="url(#flow-arrow)"/>
  <line x1="450" y1="450" x2="450" y2="490" stroke="#34495e" stroke-width="2" marker-end="url(#flow-arrow)"/>
  
  <!-- エラーハンドリング -->
  <rect x="50" y="350" width="120" height="40" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="110" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e74c3c">
    エラーハンドリング
  </text>
  <text x="110" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">
    例外処理・エラー通知
  </text>
  
  <rect x="730" y="350" width="120" height="40" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="790" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e74c3c">
    エラーハンドリング
  </text>
  <text x="790" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">
    例外処理・エラー通知
  </text>
  
  <!-- エラー矢印 -->
  <line x1="175" y1="270" x2="110" y2="350" stroke="#e74c3c" stroke-width="2" marker-end="url(#error-arrow)" stroke-dasharray="5,5"/>
  <line x1="725" y1="270" x2="790" y2="350" stroke="#e74c3c" stroke-width="2" marker-end="url(#error-arrow)" stroke-dasharray="5,5"/>
  
  <!-- 説明テキスト -->
  <text x="50" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    重要なポイント：
  </text>
  <text x="50" y="585" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    • 各ステップで適切なエラーハンドリングを実装　• 依存関係逆転の原則に従いインターフェースに依存　• トランザクション境界を明確に定義
  </text>
</svg>
