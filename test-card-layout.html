<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カードレイアウトテスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-8">カードレイアウトテスト</h1>
    
    <!-- 学習プランのコード例 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <!-- 固定高さで画像が歪む -->
            <img
                src="https://picsum.photos/400/300?random=1"
                alt="画像1"
                class="w-full h-48 object-cover"
            />
            <div class="p-4">
                <h3 class="text-lg font-semibold">短いタイトル</h3>
                <p class="text-gray-600">短い説明文</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <img
                src="https://picsum.photos/400/300?random=2"
                alt="画像2"
                class="w-full h-48 object-cover"
            />
            <div class="p-4">
                <h3 class="text-lg font-semibold">
                    非常に長いタイトルで複数行になる場合
                </h3>
                <p class="text-gray-600">
                    長い説明文でカードの高さが不揃いになり、
                    グリッドレイアウトが崩れる原因となります。
                </p>
            </div>
        </div>
        
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <img
                src="https://picsum.photos/400/300?random=3"
                alt="画像3"
                class="w-full h-48 object-cover"
            />
            <div class="p-4">
                <h3 class="text-lg font-semibold">中程度のタイトル</h3>
                <p class="text-gray-600">中程度の説明文です。</p>
            </div>
        </div>
    </div>
    
    <div class="mt-8 p-4 bg-yellow-100 rounded-lg">
        <h2 class="text-lg font-semibold mb-2">検証結果:</h2>
        <p class="text-sm">ブラウザで実際の表示を確認してください。CSS Gridの特性により、同じ行のカードは自動的に同じ高さに揃えられます。</p>
    </div>
</body>
</html>
