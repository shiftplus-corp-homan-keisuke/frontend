<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    const assertion による型の厳密化
  </text>
  
  <!-- 通常の型推論（左側） -->
  <text x="225" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
    ❌ 通常の型推論（widening）
  </text>
  
  <!-- 通常の型推論の例 -->
  <rect x="50" y="90" width="350" height="200" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="5"/>
  
  <!-- コード例1 -->
  <rect x="70" y="110" width="310" height="40" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="80" y="125" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    let theme = "dark";
  </text>
  <text x="80" y="140" font-family="Monaco, monospace" font-size="10" fill="#7f8c8d">
    // 型: string（再代入可能）
  </text>
  
  <!-- コード例2 -->
  <rect x="70" y="160" width="310" height="60" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="80" y="175" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    let config = {
  </text>
  <text x="80" y="190" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
      apiUrl: "https://api.example.com"
  </text>
  <text x="80" y="205" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    };
  </text>
  
  <!-- 型情報 -->
  <rect x="70" y="230" width="310" height="50" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1" rx="3"/>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    推論される型:
  </text>
  <text x="80" y="260" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
    { apiUrl: string; }
  </text>
  <text x="80" y="275" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">
    ⚠️ 値が汎用的な型に拡張される
  </text>
  
  <!-- const assertion（右側） -->
  <text x="675" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
    ✅ const assertion（厳密な型推論）
  </text>
  
  <!-- const assertionの例 -->
  <rect x="500" y="90" width="350" height="200" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  
  <!-- コード例1 -->
  <rect x="520" y="110" width="310" height="40" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="530" y="125" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    const theme = "dark" as const;
  </text>
  <text x="530" y="140" font-family="Monaco, monospace" font-size="10" fill="#7f8c8d">
    // 型: "dark"（リテラル型）
  </text>
  
  <!-- コード例2 -->
  <rect x="520" y="160" width="310" height="60" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="530" y="175" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    const config = {
  </text>
  <text x="530" y="190" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
      apiUrl: "https://api.example.com"
  </text>
  <text x="530" y="205" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    } as const;
  </text>
  
  <!-- 型情報 -->
  <rect x="520" y="230" width="310" height="50" fill="#d1f2eb" stroke="#58d68d" stroke-width="1" rx="3"/>
  <text x="530" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    推論される型:
  </text>
  <text x="530" y="260" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
    readonly { apiUrl: "https://api.example.com"; }
  </text>
  <text x="530" y="275" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
    ✅ 具体的な値がリテラル型として保持
  </text>
  
  <!-- 実用例 -->
  <text x="450" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    実用例：設定オブジェクトの型安全性
  </text>
  
  <rect x="100" y="350" width="700" height="120" fill="#f8f9fa" stroke="#95a5a6" stroke-width="2" rx="5"/>
  
  <!-- 実用例のコード -->
  <text x="120" y="375" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    const STUDENT_GRADES = {
  </text>
  <text x="120" y="390" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
      EXCELLENT: 90, GOOD: 80, AVERAGE: 70, POOR: 60
  </text>
  <text x="120" y="405" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    } as const;
  </text>
  <text x="120" y="430" font-family="Monaco, monospace" font-size="12" fill="#2c3e50">
    type GradeThreshold = (typeof STUDENT_GRADES)[keyof typeof STUDENT_GRADES];
  </text>
  <text x="120" y="445" font-family="Monaco, monospace" font-size="11" fill="#27ae60">
    // 型: 90 | 80 | 70 | 60（具体的な数値のUnion型）
  </text>
  <text x="120" y="460" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
    ✨ 設定値が型として活用でき、タイポや不正な値を防げる
  </text>
  
  <!-- 利点の説明 -->
  <text x="450" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    const assertion の利点
  </text>
  
  <rect x="50" y="530" width="200" height="60" fill="#e8f4fd" stroke="#3498db" stroke-width="1" rx="3"/>
  <text x="60" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">
    🔒 型安全性の向上
  </text>
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    具体的な値による制約
  </text>
  <text x="60" y="575" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    不正な値の代入を防止
  </text>
  
  <rect x="270" y="530" width="200" height="60" fill="#fff3e0" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="280" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">
    📝 設定管理の改善
  </text>
  <text x="280" y="560" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    定数値の型活用
  </text>
  <text x="280" y="575" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    設定変更時の型チェック
  </text>
  
  <rect x="490" y="530" width="200" height="60" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="500" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
    🚀 開発効率の向上
  </text>
  <text x="500" y="560" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    IDEの補完機能強化
  </text>
  <text x="500" y="575" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    リファクタリング支援
  </text>
  
  <rect x="710" y="530" width="140" height="60" fill="#ffebee" stroke="#e74c3c" stroke-width="1" rx="3"/>
  <text x="720" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    🛡️ 実行時エラー防止
  </text>
  <text x="720" y="560" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    コンパイル時検証
  </text>
  <text x="720" y="575" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    バグの早期発見
  </text>
</svg>
