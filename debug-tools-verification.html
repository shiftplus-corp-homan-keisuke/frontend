<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwindデバッグツール検証</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Tailwindプロジェクト用デバッグCSS（学習ファイルから） */
      .debug-layout * {
        @apply outline outline-1 outline-red-300 bg-green-100 bg-opacity-10;
      }

      .debug-layout .flex {
        @apply outline-blue-500 outline-2;
      }

      .debug-layout .grid {
        @apply outline-green-500 outline-2;
      }

      /* サイズ情報の表示 */
      .debug-layout *::before {
        content: attr(class);
        @apply absolute -top-6 left-0 text-xs bg-black text-white px-1 py-0.5 rounded z-50;
        font-family: monospace;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body class="p-8 bg-gray-100">
    <h1 class="text-2xl font-bold mb-6">Tailwindデバッグツール検証</h1>

    <!-- デバッグツールのテスト -->
    <section class="mb-12">
      <h2 class="text-xl font-semibold mb-4">🔧 デバッグツールテスト</h2>

      <div class="mb-6">
        <button
          id="toggleDebug"
          class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
        >
          デバッグモード切り替え
        </button>
        <button
          id="testDebugFunction"
          class="ml-2 px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600"
        >
          デバッグ関数テスト
        </button>
        <button
          id="checkConfig"
          class="ml-2 px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600"
        >
          設定チェック
        </button>
      </div>

      <!-- テスト用のレイアウト -->
      <div id="testLayout" class="space-y-4">
        <!-- Flexboxテスト -->
        <div class="card-container flex gap-4 p-4 border rounded-lg bg-white">
          <div class="flex-1 p-4 bg-blue-100 rounded">Flex Item 1</div>
          <div class="flex-1 p-4 bg-green-100 rounded">Flex Item 2</div>
          <div class="flex-1 p-4 bg-red-100 rounded">Flex Item 3</div>
        </div>

        <!-- Gridテスト -->
        <div class="grid grid-cols-3 gap-4 p-4 border rounded-lg bg-white">
          <div class="p-4 bg-yellow-100 rounded">Grid Item 1</div>
          <div class="featured-item col-span-2 p-4 bg-blue-100 rounded">
            Featured Grid Item
          </div>
          <div class="p-4 bg-purple-100 rounded">Grid Item 3</div>
        </div>

        <!-- レスポンシブテスト -->
        <div
          class="flex flex-col md:flex-row gap-4 p-4 border rounded-lg bg-white"
        >
          <div class="w-full md:w-1/3 p-4 bg-orange-100 rounded">
            Responsive 1
          </div>
          <div class="w-full md:w-2/3 p-4 bg-cyan-100 rounded">
            Responsive 2
          </div>
        </div>
      </div>
    </section>

    <!-- コンソール出力表示 -->
    <section class="mb-12">
      <h2 class="text-xl font-semibold mb-4">📊 デバッグ結果</h2>
      <div
        id="debugOutput"
        class="bg-black text-green-400 p-4 rounded-lg font-mono text-sm min-h-[200px] overflow-auto"
      >
        コンソールを開いてデバッグ情報を確認してください。<br />
        または上のボタンをクリックしてテストを実行してください。
      </div>
    </section>

    <script>
      // 学習ファイルのデバッグ関数を実装
      function debugTailwindElement(selector) {
        const element = document.querySelector(selector);
        if (!element) {
          logToOutput(`❌ Element not found: ${selector}`);
          return;
        }

        const classes = element.className.split(" ");
        const computedStyle = getComputedStyle(element);

        logToOutput(`🎨 Tailwind Debug: ${selector}`);

        // Flexbox関連クラス
        const flexClasses = classes.filter(
          (c) =>
            c.includes("flex") || c.includes("justify") || c.includes("items")
        );
        if (flexClasses.length > 0) {
          logToOutput("🔧 Flex Classes: " + flexClasses.join(", "));
          logToOutput(
            "📐 Computed: " +
              JSON.stringify(
                {
                  display: computedStyle.display,
                  flexDirection: computedStyle.flexDirection,
                  justifyContent: computedStyle.justifyContent,
                  alignItems: computedStyle.alignItems,
                },
                null,
                2
              )
          );
        }

        // Grid関連クラス
        const gridClasses = classes.filter(
          (c) => c.includes("grid") || c.includes("col") || c.includes("row")
        );
        if (gridClasses.length > 0) {
          logToOutput("🔧 Grid Classes: " + gridClasses.join(", "));
          logToOutput(
            "📐 Computed: " +
              JSON.stringify(
                {
                  display: computedStyle.display,
                  gridTemplateColumns: computedStyle.gridTemplateColumns,
                  gridTemplateRows: computedStyle.gridTemplateRows,
                  gridAutoFlow: computedStyle.gridAutoFlow,
                },
                null,
                2
              )
          );
        }

        // サイズ関連クラス
        const sizeClasses = classes.filter((c) =>
          c.match(/^(w-|h-|min-|max-|p-|m-)/)
        );
        if (sizeClasses.length > 0) {
          logToOutput("📏 Size Classes: " + sizeClasses.join(", "));
          logToOutput(
            "📐 Computed Size: " +
              JSON.stringify(
                {
                  width: computedStyle.width,
                  height: computedStyle.height,
                  padding: computedStyle.padding,
                  margin: computedStyle.margin,
                },
                null,
                2
              )
          );
        }

        logToOutput("─".repeat(50));
      }

      // Tailwind設定チェッカー（学習ファイルから）
      function checkTailwindConfig() {
        const breakpoints = {
          sm: 640,
          md: 768,
          lg: 1024,
          xl: 1280,
          "2xl": 1536,
        };

        const currentWidth = window.innerWidth;
        const activeBreakpoint =
          Object.entries(breakpoints)
            .filter(([_, width]) => currentWidth >= width)
            .pop()?.[0] || "base";

        logToOutput(
          `📱 Current Screen: ${currentWidth}px (${activeBreakpoint})`
        );

        // コンテナクエリの対応状況
        const supportsContainerQueries =
          "container" in document.documentElement.style;
        logToOutput(
          `🔧 Container Queries Support: ${
            supportsContainerQueries ? "✅" : "❌"
          }`
        );

        // Tailwind JIT モードの確認
        const hasArbitraryValue = document.querySelector('[class*="["]');
        logToOutput(
          `⚡ Arbitrary Values Detected: ${hasArbitraryValue ? "✅" : "❌"}`
        );

        // 追加：CSS Grid対応状況
        const supportsGrid = CSS.supports("display", "grid");
        logToOutput(`🏗️ CSS Grid Support: ${supportsGrid ? "✅" : "❌"}`);

        // 追加：Flexbox対応状況
        const supportsFlex = CSS.supports("display", "flex");
        logToOutput(`🔧 CSS Flexbox Support: ${supportsFlex ? "✅" : "❌"}`);

        logToOutput("─".repeat(50));
      }

      // デバッグ出力をページに表示する関数
      function logToOutput(message) {
        const output = document.getElementById("debugOutput");
        output.innerHTML += message + "<br>";
        output.scrollTop = output.scrollHeight;
        console.log(message); // コンソールにも出力
      }

      // イベントリスナー
      document
        .getElementById("toggleDebug")
        .addEventListener("click", function () {
          const layout = document.getElementById("testLayout");
          layout.classList.toggle("debug-layout");
          logToOutput(
            layout.classList.contains("debug-layout")
              ? "✅ デバッグモード ON"
              : "❌ デバッグモード OFF"
          );
        });

      document
        .getElementById("testDebugFunction")
        .addEventListener("click", function () {
          logToOutput("🔍 デバッグ関数を実行中...");
          debugTailwindElement(".card-container");
          debugTailwindElement(".featured-item");
        });

      document
        .getElementById("checkConfig")
        .addEventListener("click", function () {
          logToOutput("⚙️ Tailwind設定をチェック中...");
          checkTailwindConfig();
        });

      // リサイズ時の自動チェック
      window.addEventListener("resize", function () {
        logToOutput("📐 画面サイズが変更されました");
        checkTailwindConfig();
      });

      // 初期実行
      window.addEventListener("load", function () {
        logToOutput("🚀 デバッグツールが読み込まれました");
        checkTailwindConfig();
      });
    </script>
  </body>
</html>
