<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="250" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  
  <!-- タイトル -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a202c">
    map と filter - 高階関数の実例
  </text>
  
  <!-- map セクション -->
  <g>
    <text x="70" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
      📊 map - データ変換の高階関数
    </text>
    
    <!-- 元の配列 -->
    <g>
      <rect x="60" y="80" width="60" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="3"/>
      <text x="90" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1976d2">
        [1, 2, 3]
      </text>
    </g>
    
    <!-- 矢印 -->
    <defs>
      <marker id="arrowMap" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#666" />
      </marker>
    </defs>
    <line x1="120" y1="95" x2="170" y2="95" stroke="#666" stroke-width="2" marker-end="url(#arrowMap)"/>
    
    <!-- map関数 -->
    <g>
      <rect x="170" y="75" width="120" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
      <text x="230" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f57c00" font-weight="bold">
        map(x => x * 2)
      </text>
      <text x="230" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
        各要素を2倍に変換
      </text>
    </g>
    
    <!-- 矢印 -->
    <line x1="290" y1="95" x2="340" y2="95" stroke="#666" stroke-width="2" marker-end="url(#arrowMap)"/>
    
    <!-- 結果配列 -->
    <g>
      <rect x="340" y="80" width="70" height="30" fill="#e8f5e8" stroke="#388e3c" stroke-width="1" rx="3"/>
      <text x="375" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#388e3c">
        [2, 4, 6]
      </text>
    </g>
    
    <!-- 変換関数の説明 -->
    <text x="450" y="95" font-family="Arial, sans-serif" font-size="10" fill="#666">
      💡 変換関数を受け取る高階関数
    </text>
  </g>
  
  <!-- filter セクション -->
  <g>
    <text x="70" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7b1fa2">
      🔍 filter - データフィルタリングの高階関数
    </text>
    
    <!-- 元の配列 -->
    <g>
      <rect x="60" y="170" width="80" height="30" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1" rx="3"/>
      <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7b1fa2">
        [1, 2, 3, 4, 5]
      </text>
    </g>
    
    <!-- 矢印 -->
    <line x1="140" y1="185" x2="190" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrowMap)"/>
    
    <!-- filter関数 -->
    <g>
      <rect x="190" y="165" width="120" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
      <text x="250" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f57c00" font-weight="bold">
        filter(x => x % 2 === 0)
      </text>
      <text x="250" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
        偶数のみを抽出
      </text>
    </g>
    
    <!-- 矢印 -->
    <line x1="310" y1="185" x2="360" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrowMap)"/>
    
    <!-- 結果配列 -->
    <g>
      <rect x="360" y="170" width="50" height="30" fill="#e8f5e8" stroke="#388e3c" stroke-width="1" rx="3"/>
      <text x="385" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#388e3c">
        [2, 4]
      </text>
    </g>
    
    <!-- 条件関数の説明 -->
    <text x="450" y="185" font-family="Arial, sans-serif" font-size="10" fill="#666">
      💡 条件関数を受け取る高階関数
    </text>
  </g>
  
  <!-- まとめ -->
  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🎯 どちらも関数を引数として受け取るため、高階関数です！
  </text>
</svg>
