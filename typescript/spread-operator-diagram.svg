<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- タイトル -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    スプレッド演算子（...）による配列の結合
  </text>
  
  <!-- animalBox -->
  <g id="animalBox">
    <!-- 箱 -->
    <rect x="50" y="80" width="180" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="140" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">
      animalBox
    </text>
    
    <!-- 配列要素 -->
    <circle cx="90" cy="140" r="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="148" text-anchor="middle" font-size="20">🐰</text>
    
    <circle cx="140" cy="140" r="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="148" text-anchor="middle" font-size="20">🧸</text>
    
    <circle cx="190" cy="140" r="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="190" y="148" text-anchor="middle" font-size="20">🐱</text>
    
    <!-- インデックス表示 -->
    <text x="90" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[0]</text>
    <text x="140" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[1]</text>
    <text x="190" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[2]</text>
  </g>
  
  <!-- birdBox -->
  <g id="birdBox">
    <!-- 箱 -->
    <rect x="300" y="80" width="130" height="120" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="365" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">
      birdBox
    </text>
    
    <!-- 配列要素 -->
    <circle cx="340" cy="140" r="20" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="340" y="148" text-anchor="middle" font-size="20">🦩</text>
    
    <circle cx="390" cy="140" r="20" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="390" y="148" text-anchor="middle" font-size="20">🦚</text>
    
    <!-- インデックス表示 -->
    <text x="340" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[0]</text>
    <text x="390" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[1]</text>
  </g>
  
  <!-- スプレッド演算子の説明 -->
  <g id="spreadOperator">
    <text x="140" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">
      ...animalBox
    </text>
    <text x="365" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">
      ...birdBox
    </text>
  </g>
  
  <!-- 矢印 -->
  <g id="arrows">
    <!-- animalBoxからの矢印 -->
    <path d="M 140 250 Q 200 280 300 320" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- birdBoxからの矢印 -->
    <path d="M 365 250 Q 400 280 450 320" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- 矢印のマーカー定義 -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
      </marker>
    </defs>
  </g>
  
  <!-- bigBox -->
  <g id="bigBox">
    <!-- 箱 -->
    <rect x="200" y="340" width="350" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="375" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d">
      bigBox = [...animalBox, ...birdBox]
    </text>
    
    <!-- 結合された配列要素 -->
    <circle cx="250" cy="400" r="20" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="408" text-anchor="middle" font-size="20">🐰</text>
    
    <circle cx="300" cy="400" r="20" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="300" y="408" text-anchor="middle" font-size="20">🧸</text>
    
    <circle cx="350" cy="400" r="20" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="350" y="408" text-anchor="middle" font-size="20">🐱</text>
    
    <circle cx="400" cy="400" r="20" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="400" y="408" text-anchor="middle" font-size="20">🦩</text>
    
    <circle cx="450" cy="400" r="20" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="408" text-anchor="middle" font-size="20">🦚</text>
    
    <!-- インデックス表示 -->
    <text x="250" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[0]</text>
    <text x="300" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[1]</text>
    <text x="350" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[2]</text>
    <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[3]</text>
    <text x="450" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">[4]</text>
  </g>
  
  <!-- 説明テキスト -->
  <g id="explanation">
    <text x="50" y="480" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      スプレッド演算子（...）は配列の要素を展開し、新しい配列に結合します
    </text>
  </g>
  
  <!-- コード表示エリア -->
  <g id="codeArea">
    <rect x="480" y="80" width="280" height="200" rx="5" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="490" y="100" font-family="Monaco, monospace" font-size="11" fill="#10b981">
      const animalBox = ['🐰', '🧸', '🐱'];
    </text>
    <text x="490" y="120" font-family="Monaco, monospace" font-size="11" fill="#3b82f6">
      const birdBox = ['🦩', '🦚'];
    </text>
    <text x="490" y="150" font-family="Monaco, monospace" font-size="11" fill="#6b7280">
      // 2つの箱の中身をぜんぶ出して、
    </text>
    <text x="490" y="170" font-family="Monaco, monospace" font-size="11" fill="#6b7280">
      // 新しい大きな箱に入れる
    </text>
    <text x="490" y="200" font-family="Monaco, monospace" font-size="11" fill="#f59e0b">
      const bigBox = [...animalBox, ...birdBox];
    </text>
    <text x="490" y="230" font-family="Monaco, monospace" font-size="11" fill="#6b7280">
      // ['🐰', '🧸', '🐱', '🦩', '🦚']
    </text>
    <text x="490" y="250" font-family="Monaco, monospace" font-size="11" fill="#6b7280">
      // 全部入った！
    </text>
  </g>
</svg>