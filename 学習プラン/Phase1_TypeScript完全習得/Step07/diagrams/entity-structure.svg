<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Entity層の構造（ブログドメイン例）
  </text>
  
  <!-- BlogPost Entity -->
  <rect x="50" y="80" width="200" height="180" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="150" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
    BlogPost Entity
  </text>
  <line x1="60" y1="110" x2="240" y2="110" stroke="#27ae60" stroke-width="1"/>
  
  <!-- BlogPost プロパティ -->
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    - id: BlogPostId
  </text>
  <text x="60" y="145" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    - title: BlogTitle
  </text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    - content: BlogContent
  </text>
  <text x="60" y="175" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    - status: BlogStatus
  </text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    - authorId: AuthorId
  </text>
  
  <line x1="60" y1="200" x2="240" y2="200" stroke="#27ae60" stroke-width="1"/>
  
  <!-- BlogPost メソッド -->
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    + publish(): void
  </text>
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    + updateContent(): void
  </text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    + canBePublished(): boolean
  </text>
  
  <!-- Value Objects -->
  <rect x="300" y="80" width="150" height="80" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="375" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">
    BlogPostId
  </text>
  <line x1="310" y1="110" x2="440" y2="110" stroke="#f39c12" stroke-width="1"/>
  <text x="310" y="130" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    - value: string
  </text>
  <line x1="310" y1="140" x2="440" y2="140" stroke="#f39c12" stroke-width="1"/>
  <text x="310" y="155" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    + getValue(): string
  </text>
  
  <rect x="300" y="180" width="150" height="80" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="375" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">
    BlogTitle
  </text>
  <line x1="310" y1="210" x2="440" y2="210" stroke="#f39c12" stroke-width="1"/>
  <text x="310" y="230" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    - value: string
  </text>
  <line x1="310" y1="240" x2="440" y2="240" stroke="#f39c12" stroke-width="1"/>
  <text x="310" y="255" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    + getValue(): string
  </text>
  
  <rect x="300" y="280" width="150" height="100" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="375" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">
    BlogContent
  </text>
  <line x1="310" y1="310" x2="440" y2="310" stroke="#f39c12" stroke-width="1"/>
  <text x="310" y="330" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    - value: string
  </text>
  <line x1="310" y1="340" x2="440" y2="340" stroke="#f39c12" stroke-width="1"/>
  <text x="310" y="355" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    + getValue(): string
  </text>
  <text x="310" y="370" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    + getWordCount(): number
  </text>
  
  <!-- Enum -->
  <rect x="500" y="80" width="150" height="100" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="575" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">
    BlogStatus (Enum)
  </text>
  <line x1="510" y1="110" x2="640" y2="110" stroke="#3498db" stroke-width="1"/>
  <text x="510" y="130" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    DRAFT = 'draft'
  </text>
  <text x="510" y="145" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    PUBLISHED = 'published'
  </text>
  <text x="510" y="160" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    ARCHIVED = 'archived'
  </text>
  
  <!-- Domain Exceptions -->
  <rect x="500" y="200" width="200" height="120" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    Domain Exceptions
  </text>
  <line x1="510" y1="230" x2="690" y2="230" stroke="#e74c3c" stroke-width="1"/>
  <text x="510" y="250" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    BlogPostAlreadyPublishedError
  </text>
  <text x="510" y="265" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    PublishedPostCannotBeEditedError
  </text>
  <text x="510" y="280" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    InvalidBlogTitleError
  </text>
  <text x="510" y="295" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    InvalidBlogContentError
  </text>
  
  <!-- 関連線 -->
  <defs>
    <marker id="composition" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- BlogPost から Value Objects への関連 -->
  <line x1="250" y1="130" x2="300" y2="120" stroke="#34495e" stroke-width="1" marker-end="url(#composition)"/>
  <line x1="250" y1="145" x2="300" y2="220" stroke="#34495e" stroke-width="1" marker-end="url(#composition)"/>
  <line x1="250" y1="160" x2="300" y2="330" stroke="#34495e" stroke-width="1" marker-end="url(#composition)"/>
  <line x1="250" y1="175" x2="500" y2="130" stroke="#34495e" stroke-width="1" marker-end="url(#composition)"/>
  
  <!-- 説明テキスト -->
  <text x="50" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Entity層設計のポイント
  </text>
  
  <text x="50" y="450" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    🔹 不変性：値オブジェクトは不変（Immutable）に設計
  </text>
  <text x="50" y="470" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    🔹 バリデーション：コンストラクタで不正な状態を防ぐ
  </text>
  <text x="50" y="490" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    🔹 ドメインロジック：ビジネスルールをエンティティ内に実装
  </text>
  <text x="50" y="510" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    🔹 カプセル化：内部状態を適切に隠蔽し、ゲッターで読み取り専用アクセス
  </text>
  <text x="50" y="530" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    🔹 ドメイン例外：ビジネスルール違反を明確に表現
  </text>
  
  <!-- 凡例 -->
  <text x="50" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    凡例：
  </text>
  <rect x="120" y="560" width="15" height="15" fill="#e8f5e8" stroke="#27ae60" stroke-width="1"/>
  <text x="140" y="572" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Entity</text>
  
  <rect x="200" y="560" width="15" height="15" fill="#fff3e0" stroke="#f39c12" stroke-width="1"/>
  <text x="220" y="572" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Value Object</text>
  
  <rect x="300" y="560" width="15" height="15" fill="#e8f4fd" stroke="#3498db" stroke-width="1"/>
  <text x="320" y="572" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Enum</text>
  
  <rect x="370" y="560" width="15" height="15" fill="#ffebee" stroke="#e74c3c" stroke-width="1"/>
  <text x="390" y="572" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Exception</text>
</svg>
